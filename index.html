<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>宝塚 路線スター 好き顔TOP5</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --blue:#77bceb;
  --blue2:#a9d8f5;
  --blue3:#eaf7ff;
  --deep:#355c7d;
  --text:#293747;
  --white:#ffffff;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background:
    radial-gradient(circle at 10% 5%,rgba(148,211,248,.28),transparent 24%),
    radial-gradient(circle at 90% 18%,rgba(195,228,249,.34),transparent 24%),
    linear-gradient(180deg,#f8fdff 0%,#edf8ff 100%);

  min-height:100vh;
}

button{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

button:disabled{
  opacity:.42;
}

.wrap{
  width:min(100%,760px);
  margin:auto;
  padding:18px 14px 60px;
}

/* ==================================================
   TOP画面のヘッダー
   ここは元の大きいデザイン
================================================== */

.hero{
  position:relative;
  overflow:hidden;
  text-align:center;

  padding:29px 14px 25px;
  margin-bottom:14px;

  background:rgba(255,255,255,.82);
  border:1px solid #d8edf9;
  border-radius:26px;

  box-shadow:
    0 10px 30px rgba(61,127,170,.10);
}

.hero::before,
.hero::after{
  content:"";
  position:absolute;
  width:180px;
  height:42px;
  background:#9ed7f5;
  opacity:.18;
  border-radius:50%;
  transform:rotate(-13deg);
}

.hero::before{
  left:-45px;
  top:26px;
}

.hero::after{
  right:-45px;
  bottom:25px;
  transform:rotate(15deg);
}

.eyebrow{
  position:relative;
  color:#7ea9c7;
  font-family:Georgia,serif;
  letter-spacing:.20em;
  font-size:12px;
  margin-bottom:7px;
}

h1{
  position:relative;
  margin:0;
  font-size:clamp(27px,7vw,45px);
  line-height:1.18;
  letter-spacing:.02em;
  color:#30485e;
}

h1 .blue{
  color:#68afe0;
}

.heroText{
  position:relative;
  margin:12px auto 0;
  max-width:570px;
  font-size:12px;
  line-height:1.8;
  color:#667b8c;
}

.sparkles{
  position:relative;
  margin-top:11px;
  color:#8fc8eb;
  letter-spacing:.5em;
}

/* ==================================================
   ゲーム開始後
   大きいヘッダーを消す
================================================== */

body.gameMode .hero{
  display:none;
}

body.gameMode .wrap{
  padding:
    max(8px,env(safe-area-inset-top))
    7px
    18px;
}

/* ==================================================
   進捗
================================================== */

.progress{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin:14px 2px;
}

.progressItem{
  text-align:center;
  color:#9aa9b5;
  font-size:10px;
}

.progressCircle{
  margin:0 auto 5px;
  width:31px;
  height:31px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;
  background:#e5edf2;

  font-weight:800;
}

.progressItem.active{
  color:#4b9bd0;
  font-weight:800;
}

.progressItem.active .progressCircle{
  color:white;
  background:
    linear-gradient(135deg,#82c9f2,#60aee0);

  box-shadow:
    0 4px 12px rgba(72,157,214,.25);
}

/* TOPでは進捗なし */

body.homeMode .progress{
  display:none;
}

/* ゲーム中だけ超コンパクト */

body.gameMode .progress{
  margin:0 5px 5px;
  gap:3px;
}

body.gameMode .progressItem{
  font-size:8px;
  line-height:1;
}

body.gameMode .progressCircle{
  width:21px;
  height:21px;
  margin:0 auto 2px;
  font-size:9px;
}

/* ==================================================
   パネル
================================================== */

.panel{
  background:rgba(255,255,255,.94);
  border:1px solid #dceef8;
  border-radius:23px;
  padding:17px;

  box-shadow:
    0 9px 27px rgba(58,124,164,.09);
}

.stageTitle{
  text-align:center;
  margin:2px 0 5px;
  font-size:21px;
  color:#345c78;
}

.stageDescription{
  text-align:center;
  font-size:12px;
  color:#8496a3;
  line-height:1.65;
  margin-bottom:14px;
}

.counter{
  text-align:center;
  font-weight:800;
  color:#519ed0;
  margin:4px 0 13px;
  font-size:13px;
}

/* 選択・絞り込み中だけコンパクト */

body.compactCards .panel{
  padding:7px;
  border-radius:17px;
}

body.compactCards .stageTitle{
  margin:0 0 1px;
  font-size:16px;
  line-height:1.15;
}

body.compactCards .stageDescription{
  margin:0 0 3px;
  font-size:9px;
  line-height:1.25;
}

body.compactCards .counter{
  margin:1px 0 5px;
  font-size:10px;
}

/* ==================================================
   TOP画面
================================================== */

.homePanel{
  text-align:center;
}

.homePanel .notice{
  margin-top:13px;
}

.homePanel .btnFull{
  margin-top:10px;
}

/* ==================================================
   人物カード
================================================== */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.card{
  position:relative;
  overflow:hidden;

  padding:5px 5px 9px;

  background:white;

  border:2px solid #e6eef3;
  border-radius:16px;

  cursor:pointer;

  transition:.15s ease;

  box-shadow:
    0 3px 10px rgba(47,86,110,.06);
}

.card:active{
  transform:scale(.98);
}

.card.selected{
  border-color:#69b9e9;
  background:#f0faff;

  box-shadow:
    0 0 0 3px rgba(105,185,233,.12),
    0 6px 15px rgba(61,146,200,.14);
}

.photoWrap{
  width:100%;
  aspect-ratio:3/4;
  border-radius:11px;
  overflow:hidden;
  background:#eef3f6;
}

.photoWrap img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.check{
  position:absolute;
  right:8px;
  top:8px;
  z-index:2;

  width:24px;
  height:24px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.93);

  border:2px solid #b9d8ea;

  color:white;
  font-size:14px;
  font-weight:900;
}

.card.selected .check{
  background:#65b5e6;
  border-color:#65b5e6;
}

.group{
  text-align:center;
  font-size:11px;
  font-weight:800;
  margin-top:7px;
}

.name{
  text-align:center;
  margin-top:2px;
  font-size:13px;
  font-weight:800;
  line-height:1.3;
}

/* ==================================================
   ゲーム中の9人カードを小さく
================================================== */

body.compactCards .grid{
  gap:4px;
}

body.compactCards .card{
  padding:3px 3px 4px;
  border-radius:11px;
  border-width:1.5px;
}

body.compactCards .photoWrap{
  /*
    ここが重要！
    3:4より少し横長にして
    9人＋次へボタンを収めやすくする
  */
  aspect-ratio:4/4.45;
  border-radius:8px;
}

body.compactCards .group{
  margin-top:2px;
  font-size:8px;
  line-height:1.05;
}

body.compactCards .name{
  margin-top:1px;
  font-size:9px;
  line-height:1.1;
  min-height:10px;
}

body.compactCards .check{
  width:18px;
  height:18px;
  right:5px;
  top:5px;
  border-width:1.5px;
  font-size:10px;
}

/* 組カラー */

.g-花組{color:#ef8fb2;}
.g-月組{color:#d3ae34;}
.g-雪組{color:#71b99a;}
.g-星組{color:#65b9df;}
.g-宙組{color:#a58bd8;}
.g-専科{color:#74569e;}

/* ==================================================
   ボタン
================================================== */

.actions{
  display:flex;
  gap:8px;
  margin-top:17px;
}

.btn{
  border:0;
  border-radius:999px;
  padding:13px 15px;
  font-weight:800;
  cursor:pointer;
}

.btnPrimary{
  flex:1;
  color:white;

  background:
    linear-gradient(135deg,#82c9f2,#58a8dd);

  box-shadow:
    0 6px 15px rgba(72,157,214,.23);
}

.btnSecondary{
  color:#5389ad;
  background:#f3faff;
  border:1px solid #c9e5f5;
}

.btnFull{
  width:100%;
  margin-top:10px;
}

body.compactCards .actions{
  margin-top:5px;
  gap:5px;
}

body.compactCards .btn{
  padding:8px 10px;
  font-size:11px;
}

.notice{
  margin-top:13px;
  padding:11px 13px;

  border-radius:13px;

  background:#f1faff;
  color:#62839a;

  font-size:12px;
  line-height:1.6;
  text-align:center;
}

/* ==================================================
   1対1
================================================== */

.duel{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.duelCard{
  padding:7px 7px 13px;

  border-radius:19px;

  background:#fff;
  border:2px solid #d9edf8;

  text-align:center;
  cursor:pointer;

  box-shadow:
    0 7px 19px rgba(62,119,155,.09);
}

.duelCard:active{
  transform:scale(.985);
}

.duelCard img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  border-radius:14px;
  display:block;
}

.duelOr{
  text-align:center;
  color:#7ab8dd;
  font-family:Georgia,serif;
  font-style:italic;
  margin:14px 0;
}

/* ==================================================
   結果
================================================== */

.resultHeader{
  text-align:center;
}

.resultHeader .crown{
  font-size:31px;
}

.resultHeader h2{
  margin:5px 0;
  color:#396985;
  font-size:26px;
}

.resultGrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-top:17px;
}

.resultCard{
  position:relative;
  text-align:center;

  background:#fff;

  padding:4px 4px 8px;

  border:1px solid #d9edf8;
  border-radius:14px;
}

.resultCard img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  border-radius:10px;
  display:block;
}

.rankBadge{
  position:absolute;
  top:-8px;
  left:50%;
  transform:translateX(-50%);

  min-width:29px;
  height:29px;
  padding:0 7px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#78bce7;
  color:white;
  font-weight:900;

  border:2px solid white;
}

.resultCard:nth-child(1){
  border:2px solid #d9b84c;
}

.resultCard:nth-child(1) .rankBadge{
  background:#d7b437;
}

.resultCard:nth-child(2) .rankBadge{
  background:#aab7c2;
}

.resultCard:nth-child(3) .rankBadge{
  background:#c78a61;
}

.resultGroup{
  font-size:9px;
  margin-top:6px;
  font-weight:700;
}

.resultName{
  margin-top:2px;
  font-size:10px;
  font-weight:800;
  line-height:1.3;
}

.preview{
  margin-top:14px;
  padding:10px;
  background:#eef9ff;
  border-radius:17px;
  text-align:center;
}

.preview img{
  width:100%;
  border-radius:13px;
  display:block;
}

.previewText{
  font-size:11px;
  color:#6e899b;
  margin:8px 0 4px;
}

.hidden{
  display:none!important;
}

/* ==================================================
   小さいiPhone用
================================================== */

@media(max-width:480px){

  .wrap{
    padding-left:10px;
    padding-right:10px;
  }

  body.gameMode .wrap{
    padding-left:6px;
    padding-right:6px;
  }

  .panel{
    padding:12px;
  }

  body.compactCards .panel{
    padding:6px;
  }

  .resultGrid{
    gap:4px;
  }

  .resultName{
    font-size:8px;
  }
}

/* 高さが短いスマホではさらに少し圧縮 */

@media(max-height:750px){

  body.compactCards .photoWrap{
    aspect-ratio:4/4.15;
  }

  body.compactCards .progressCircle{
    width:19px;
    height:19px;
  }

  body.compactCards .progress{
    margin-bottom:3px;
  }

  body.compactCards .stageDescription{
    display:none;
  }
}

</style>
</head>

<body>

<div class="wrap">

  <header class="hero">

    <div class="eyebrow">
      MY TAKARAZUKA FAVORITES
    </div>

    <h1>
      宝塚 路線スター<br>
      <span class="blue">
        好き顔 TOP5
      </span>
    </h1>

    <div class="heroText">
      新公主演経験者＆別箱ヒロイン経験者から選ぶ♡<br>
      あなたの「好き顔」TOP5を決めよう！
    </div>

    <div class="sparkles">
      ✧ ♡ ✧
    </div>

  </header>

  <div
    class="progress"
    id="progress"
  ></div>

  <main id="app"></main>

</div>

<script src="members.js"></script>

<script>

/* ==================================================
   基本設定
================================================== */

const SAVE_KEY =
  "takarazukaStarTop5StateV4";

const HISTORY_KEY =
  "takarazukaStarTop5HistoryV1";

const PAGE_SIZE = 9;

let preparedFile = null;
let preparedURL = null;


/* ==================================================
   シャッフル
================================================== */

function shuffle(array){

  const a = [...array];

  for(let i=a.length-1;i>0;i--){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]] =
      [a[j],a[i]];
  }

  return a;
}


/* ==================================================
   初期状態
================================================== */

function initialState(){

  return {

    stage:"home",

    order:
      shuffle(
        members.map(m=>m.id)
      ),

    page:0,

    selected:[],

    pool:[],

    narrowPage:0,

    narrowSelected:[],

    rankingPool:[],

    sorted:[],

    insertIndex:0,

    compareIndex:0,

    result:[]
  };
}


let state =
  loadState()
  || initialState();


/* ==================================================
   保存
================================================== */

function saveState(){

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(state)
  );
}


function loadState(){

  try{

    return JSON.parse(
      localStorage.getItem(
        SAVE_KEY
      )
    );

  }catch{

    return null;
  }
}


/* ==================================================
   人物取得
================================================== */

function memberById(id){

  return members.find(
    m=>m.id===id
  );
}


function loadImage(src){

  return new Promise(
    (resolve,reject)=>{

      const image =
        new Image();

      image.onload =
        ()=>resolve(image);

      image.onerror =
        reject;

      image.src =
        src;
    }
  );
}


/* ==================================================
   表示モード
================================================== */

function setDisplayMode(mode){

  document.body.classList.remove(
    "homeMode",
    "gameMode",
    "compactCards"
  );

  if(mode==="home"){

    document.body.classList.add(
      "homeMode"
    );

  }else if(mode==="cards"){

    document.body.classList.add(
      "gameMode",
      "compactCards"
    );

  }else{

    document.body.classList.add(
      "gameMode"
    );
  }
}


/* ==================================================
   進捗
================================================== */

function renderProgress(){

  const el =
    document.getElementById(
      "progress"
    );

  const steps = [
    ["1","選ぶ"],
    ["2","絞り込み"],
    ["3","順位決定"],
    ["4","TOP5"]
  ];

  let active = 1;

  if(state.stage==="narrow"){
    active=2;
  }

  if(state.stage==="rank"){
    active=3;
  }

  if(state.stage==="result"){
    active=4;
  }

  el.innerHTML =
    steps.map(
      (step,index)=>`

      <div
        class="
          progressItem
          ${index+1===active
            ?"active"
            :""}
        "
      >

        <div class="progressCircle">
          ${step[0]}
        </div>

        ${step[1]}

      </div>

    `).join("");
}


/* ==================================================
   HOME
================================================== */

function renderHome(){

  setDisplayMode("home");

  const app =
    document.getElementById(
      "app"
    );

  app.innerHTML=`

    <section class="panel homePanel">

      <h2 class="stageTitle">
        あなたの好き顔TOP5は？
      </h2>

      <div class="stageDescription">
        候補は全部で
        <strong>${members.length}人</strong>。<br>
        まずは気になる人を自由に選んでね♡
      </div>

      <div class="notice">
        最初は何人選んでもOK！<br>
        選んだメンバーから
        20人 → 5人まで絞り込みます。
      </div>

      <button
        class="btn btnPrimary btnFull"
        onclick="startGame()"
      >
        TOP5を決める
      </button>

      <button
        class="btn btnSecondary btnFull"
        onclick="showHistory()"
      >
        過去のTOP5を見る
      </button>

    </section>
  `;
}


function startGame(){

  state =
    initialState();

  state.stage =
    "select";

  saveState();

  render();
}


/* ==================================================
   最初の選択
================================================== */

function renderSelection(){

  setDisplayMode("cards");

  const app =
    document.getElementById(
      "app"
    );

  const start =
    state.page*PAGE_SIZE;

  const ids =
    state.order.slice(
      start,
      start+PAGE_SIZE
    );

  const totalPages =
    Math.ceil(
      state.order.length
      /PAGE_SIZE
    );

  app.innerHTML=`

    <section class="panel">

      <h2 class="stageTitle">
        好きな人を選ぼう
      </h2>

      <div class="stageDescription">
        「好き顔！」と思う人をタップ♡
        何人選んでもOK！
      </div>

      <div class="counter">
        ${state.page+1} / ${totalPages}
        　♡ 選択中 ${state.selected.length}人
      </div>

      <div class="grid">

        ${ids.map(
          id=>personCard(
            id,
            state.selected.includes(id),
            `toggleSelect(${id})`
          )
        ).join("")}

      </div>

      <div class="actions">

        ${
          state.page>0
          ?`
            <button
              class="btn btnSecondary"
              onclick="previousSelectionPage()"
            >
              前へ
            </button>
          `
          :""
        }

        <button
          class="btn btnPrimary"
          onclick="nextSelectionPage()"
        >
          ${
            state.page===totalPages-1
            ?"選択を終える"
            :"次の9人"
          }
        </button>

      </div>

    </section>
  `;

  preloadNextPage();

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}


/* ==================================================
   人物カード
================================================== */

function personCard(
  id,
  selected,
  action
){

  const m =
    memberById(id);

  if(!m){
    return "";
  }

  return `

    <div
      class="
        card
        ${selected
          ?"selected"
          :""}
      "
      onclick="${action}"
    >

      <div class="check">
        ${selected?"✓":""}
      </div>

      <div class="photoWrap">

        <img
          src="${m.image}"
          alt=""
          loading="eager"
        >

      </div>

      <div
        class="group g-${m.group}"
      >
        ${m.group}
      </div>

      <div class="name">
        ${m.name}
      </div>

    </div>
  `;
}


function toggleSelect(id){

  if(
    state.selected.includes(id)
  ){

    state.selected =
      state.selected.filter(
        x=>x!==id
      );

  }else{

    state.selected.push(id);
  }

  saveState();

  renderSelection();
}


function previousSelectionPage(){

  if(state.page>0){
    state.page--;
  }

  saveState();

  renderSelection();
}


function nextSelectionPage(){

  const totalPages =
    Math.ceil(
      state.order.length
      /PAGE_SIZE
    );

  if(
    state.page
    <totalPages-1
  ){

    state.page++;

    saveState();

    renderSelection();

    return;
  }

  finishSelection();
}


/* ==================================================
   次ページ画像先読み
================================================== */

function preloadNextPage(){

  const nextStart =
    (state.page+1)
    *PAGE_SIZE;

  const ids =
    state.order.slice(
      nextStart,
      nextStart+PAGE_SIZE
    );

  ids.forEach(id=>{

    const m =
      memberById(id);

    if(!m){
      return;
    }

    const img =
      new Image();

    img.src =
      m.image;
  });
}


/* ==================================================
   最初の選択終了
================================================== */

function finishSelection(){

  if(
    state.selected.length<5
  ){

    alert(
      "TOP5を作るには5人以上選んでね！"
    );

    return;
  }


  if(
    state.selected.length===5
  ){

    startRanking(
      state.selected
    );

    return;
  }


  state.pool =
    shuffle(
      state.selected
    );

  state.narrowPage=0;

  state.narrowSelected=[];

  state.stage="narrow";

  saveState();

  render();
}


/* ==================================================
   76 → 20 → 5
================================================== */

function targetForPool(){

  const n =
    state.pool.length;

  if(n>20){
    return 20;
  }

  return 5;
}


/* ==================================================
   絞り込み
================================================== */

function renderNarrow(){

  setDisplayMode("cards");

  const app =
    document.getElementById(
      "app"
    );

  const target =
    targetForPool();

  const start =
    state.narrowPage
    *PAGE_SIZE;

  const ids =
    state.pool.slice(
      start,
      start+PAGE_SIZE
    );

  const totalPages =
    Math.ceil(
      state.pool.length
      /PAGE_SIZE
    );

  app.innerHTML=`

    <section class="panel">

      <h2 class="stageTitle">
        ${target}人まで絞ろう
      </h2>

      <div class="stageDescription">
        ${state.pool.length}人の中から
        残したい人を選んでね♡
      </div>

      <div class="counter">
        ${state.narrowPage+1}
        /
        ${totalPages}
        　♡
        ${state.narrowSelected.length}
        / ${target}人
      </div>

      <div class="grid">

        ${ids.map(
          id=>personCard(
            id,
            state.narrowSelected.includes(id),
            `toggleNarrow(${id})`
          )
        ).join("")}

      </div>

      <div class="actions">

        ${
          state.narrowPage>0
          ?`
            <button
              class="btn btnSecondary"
              onclick="previousNarrowPage()"
            >
              前へ
            </button>
          `
          :""
        }

        <button
          class="btn btnPrimary"
          onclick="nextNarrowPage()"
        >
          ${
            state.narrowPage===totalPages-1
            ?`${target}人で決定`
            :"次へ"
          }
        </button>

      </div>

    </section>
  `;

  preloadNextNarrowPage();

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}


function preloadNextNarrowPage(){

  const nextStart =
    (state.narrowPage+1)
    *PAGE_SIZE;

  const ids =
    state.pool.slice(
      nextStart,
      nextStart+PAGE_SIZE
    );

  ids.forEach(id=>{

    const m =
      memberById(id);

    if(!m){
      return;
    }

    const img =
      new Image();

    img.src =
      m.image;
  });
}


function toggleNarrow(id){

  const target =
    targetForPool();

  if(
    state.narrowSelected.includes(id)
  ){

    state.narrowSelected =
      state.narrowSelected.filter(
        x=>x!==id
      );

  }else{

    if(
      state.narrowSelected.length
      >=target
    ){

      alert(
        `${target}人まで選べます！`
      );

      return;
    }

    state.narrowSelected.push(id);
  }

  saveState();

  renderNarrow();
}


function previousNarrowPage(){

  if(
    state.narrowPage>0
  ){

    state.narrowPage--;
  }

  saveState();

  renderNarrow();
}


function nextNarrowPage(){

  const totalPages =
    Math.ceil(
      state.pool.length
      /PAGE_SIZE
    );

  if(
    state.narrowPage
    <totalPages-1
  ){

    state.narrowPage++;

    saveState();

    renderNarrow();

    return;
  }


  const target =
    targetForPool();


  if(
    state.narrowSelected.length
    !==target
  ){

    alert(
      `${target}人ちょうど選んでね！`
    );

    return;
  }


  if(target===5){

    startRanking(
      state.narrowSelected
    );

    return;
  }


  state.pool =
    shuffle(
      state.narrowSelected
    );

  state.narrowPage=0;

  state.narrowSelected=[];

  saveState();

  renderNarrow();
}


/* ==================================================
   順位決定
================================================== */

function startRanking(ids){

  state.rankingPool =
    [...ids];

  state.sorted = [
    state.rankingPool[0]
  ];

  state.insertIndex=1;

  state.compareIndex=0;

  state.stage="rank";

  saveState();

  render();
}


function renderRanking(){

  setDisplayMode("game");

  const app =
    document.getElementById(
      "app"
    );

  if(
    state.insertIndex
    >=state.rankingPool.length
  ){

    finishRanking();

    return;
  }


  const challenger =
    state.rankingPool[
      state.insertIndex
    ];

  const opponent =
    state.sorted[
      state.compareIndex
    ];


  const a =
    memberById(challenger);

  const b =
    memberById(opponent);


  app.innerHTML=`

    <section class="panel">

      <h2 class="stageTitle">
        どっちが好き顔？
      </h2>

      <div class="stageDescription">
        最後は1対1で比較して
        1位〜5位を決めます♡
      </div>

      <div class="duel">

        ${duelCard(
          a,
          `chooseDuel("challenger")`
        )}

        ${duelCard(
          b,
          `chooseDuel("opponent")`
        )}

      </div>

      <div class="duelOr">
        ♡ TAP YOUR FAVORITE ♡
      </div>

    </section>
  `;

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}


function duelCard(
  m,
  action
){

  return `

    <div
      class="duelCard"
      onclick='${action}'
    >

      <img
        src="${m.image}"
        alt=""
      >

      <div
        class="group g-${m.group}"
      >
        ${m.group}
      </div>

      <div class="name">
        ${m.name}
      </div>

    </div>
  `;
}


function chooseDuel(choice){

  const challenger =
    state.rankingPool[
      state.insertIndex
    ];


  if(
    choice==="challenger"
  ){

    state.sorted.splice(
      state.compareIndex,
      0,
      challenger
    );

    state.insertIndex++;

    state.compareIndex=0;

  }else{

    state.compareIndex++;


    if(
      state.compareIndex
      >=state.sorted.length
    ){

      state.sorted.push(
        challenger
      );

      state.insertIndex++;

      state.compareIndex=0;
    }
  }

  saveState();

  renderRanking();
}


function finishRanking(){

  state.result =
    state.sorted.slice(
      0,5
    );

  state.stage="result";

  addHistory();

  saveState();

  render();
}

/* ==================================================
   Canvas補助
================================================== */

function roundRectPath(
  ctx,x,y,w,h,r
){

  r =
    Math.min(
      r,w/2,h/2
    );

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.lineTo(x+w-r,y);

  ctx.quadraticCurveTo(
    x+w,y,
    x+w,y+r
  );

  ctx.lineTo(
    x+w,
    y+h-r
  );

  ctx.quadraticCurveTo(
    x+w,y+h,
    x+w-r,y+h
  );

  ctx.lineTo(
    x+r,
    y+h
  );

  ctx.quadraticCurveTo(
    x,y+h,
    x,y+h-r
  );

  ctx.lineTo(
    x,
    y+r
  );

  ctx.quadraticCurveTo(
    x,y,
    x+r,y
  );

  ctx.closePath();
}


function drawCover(
  ctx,img,x,y,w,h
){

  const scale =
    Math.max(
      w/img.width,
      h/img.height
    );

  const dw =
    img.width*scale;

  const dh =
    img.height*scale;

  const dx =
    x+(w-dw)/2;

  const dy =
    y+(h-dh)/2;

  ctx.drawImage(
    img,
    dx,dy,dw,dh
  );
}

async function makeResultCanvas(ids){

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width=1080;
  canvas.height=1440;

  const ctx =
    canvas.getContext("2d");


  /* 背景 */

  const gradient =
    ctx.createLinearGradient(
      0,0,0,1440
    );

  gradient.addColorStop(
    0,
    "#fafdff"
  );

  gradient.addColorStop(
    1,
    "#eaf7ff"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,0,1080,1440
  );


  /* 水色ペイント */

  function paint(
    x,y,w,h,angle
  ){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(angle);

    ctx.globalAlpha=.14;

    ctx.fillStyle="#73bfea";

    ctx.beginPath();

    ctx.moveTo(
      -w/2,
      -h/3
    );

    ctx.quadraticCurveTo(
      -w/5,
      -h*.8,
      w/2,
      -h/4
    );

    ctx.quadraticCurveTo(
      w*.45,
      h*.55,
      -w/2,
      h/3
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
  }


  paint(130,100,320,75,-.15);

  paint(90,780,230,70,-.25);

    ctx.moveTo(
      x,y-size
    );

    ctx.lineTo(
      x,y+size
    );

    ctx.moveTo(
      x-size,y
    );

    ctx.lineTo(

async function prepareResultImage(
  ids,
  button
){

  if(button){

    button.disabled=true;

    button.textContent=
      "画像を作成中…";
  }


  try{

    const canvas =
      await makeResultCanvas(
        ids
      );


    const blob =
      await new Promise(
        resolve=>
          canvas.toBlob(
            resolve,
            "image/png"
          )
      );


    if(!blob){

      throw new Error(
        "画像を作成できませんでした"
      );
    }


    preparedFile =
      new File(
        [blob],
        "takarazuka-top5.png",
        {
          type:"image/png"
        }
      );


    if(preparedURL){

      URL.revokeObjectURL(
        preparedURL
      );
    }


    preparedURL =
      URL.createObjectURL(
        blob
      );


    const preview =
      document.getElementById(
        "imagePreview"
      );


    preview.classList.remove(
      "hidden"
    );


    preview.innerHTML=`

      <img
        src="${preparedURL}"
        alt="TOP5画像"
      >

      <div class="previewText">

        画像ができました🩵
        <br>

        下のボタンから共有して

      <div class="previewText">
        共有が使えない場合は、
        上の画像を長押しして保存できます。
      </div>
    `;


    preview.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });


  }catch(error){

    console.error(error);

    alert(
      "画像の作成に失敗しました。"
    );


  }finally{

    if(button){

      button.disabled=false;

      button.textContent=
        "🩵 TOP5画像を作る";
    }
  }
}

      navigator.canShare
      &&
      navigator.canShare({
        files:[preparedFile]
      })
    ){

      await navigator.share({

        files:[
          preparedFile
        ],

        title:
          "宝塚 好き顔TOP5"
      });

      return;
    }

  }catch(error){

    if(
      error.name==="AbortError"
    ){
      return;
    }

    console.error(error);
  }


  alert(
    "上の画像を長押しして「写真に保存」を選んでね！"
  );
}


/* ==================================================
   その他
================================================== */

function restartGame(){

  state =
    initialState();

  state.stage="select";

  saveState();

  render();
}


function goHome(){

  state.stage="home";

  saveState();

  render();
}


/* ==================================================
   全体描画
================================================== */

function render(){

  renderProgress();


  switch(state.stage){

    case "select":

      renderSelection();

      break;


    case "narrow":

      renderNarrow();

      break;


    case "rank":

      renderRanking();

      break;


    case "result":

      renderResult();

      break;


    default:

      renderHome();
  }
}


render();

</script>

</html>
